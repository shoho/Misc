<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>GR Look</title>
<meta name="description" content="iPhone の写真を RICOH GR IV 風の落ち着いた色味に近づけるデモ">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="led" aria-hidden="true"></span>
    <h1>GR Look <small>demo</small></h1>
  </div>
  <div class="top-actions">
    <label class="btn primary" for="file">写真を開く</label>
    <input id="file" type="file" accept="image/*" hidden>
    <button class="btn ghost" id="sample">サンプル</button>
  </div>
</header>

<main class="app">
  <section class="stage" id="stage">
    <div class="drop" id="drop">
      <p class="drop-title">ここに写真をドロップ</p>
      <p class="drop-sub">または「写真を開く」。iPhone で撮った眩しめ・彩度高めの写真がいちばん効きます。</p>
    </div>
    <div class="viewer hidden" id="viewer">
      <canvas id="gl"></canvas>
      <div class="split-handle hidden" id="splitHandle"><span></span></div>
      <div class="hud">
        <span id="hudPreset">Standard</span>
        <span class="hud-sep">·</span>
        <span id="hudSize"></span>
        <span class="hud-hold" id="hudHold">長押しで元画像</span>
      </div>
    </div>
  </section>

  <aside class="panel">
    <div class="group">
      <div class="group-head">
        <h2>イメージコントロール</h2>
        <p class="muted">GR のモードを参考にした近似です</p>
      </div>
      <div class="chips" id="presets"></div>
    </div>

    <div class="group">
      <div class="group-head row">
        <h2>調整</h2>
        <div class="row-actions">
          <button class="link" id="compare">比較</button>
          <button class="link" id="reset">リセット</button>
        </div>
      </div>
      <div class="sliders" id="sliders"></div>
    </div>

    <div class="group actions">
      <button class="btn primary wide" id="export" disabled>書き出し (JPEG)</button>
      <p class="muted small">プレビューは縮小表示。書き出しは元の解像度(長辺 4096px まで)で処理します。画像はブラウザ内だけで処理され、どこにも送信されません。</p>
    </div>
  </aside>
</main>

<script src="app.js"></script>
</body>
</html>
